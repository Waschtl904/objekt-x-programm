name: A1 Osipov N1102 Arb certificate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a1-osipov1102:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install exact numerical dependency
        run: python -m pip install python-flint==0.9.0
      - name: Run exact-head Osipov reduction certificate
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git hash-object scripts/check_a1_osipov1102_arb.py
          python scripts/check_a1_osipov1102_arb.py | tee a1_osipov1102_arb.log
          grep -q 'CERTIFIED: Osipov concentration mu_1102(c=1551) < 1e-43' a1_osipov1102_arb.log
          grep -q 'CERTIFIED: N=1102 Schur penalty < 1.5e-40' a1_osipov1102_arb.log
          grep -q 'CERTIFIED: sufficient augmented resolved dimension <= 1104 = 552 even + 552 odd' a1_osipov1102_arb.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a1-osipov1102-arb
          path: a1_osipov1102_arb.log
