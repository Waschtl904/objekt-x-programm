name: R43 XBAND finite proxy

on:
  pull_request:
    paths:
      - 'audits/P11_R43_SCHUR_XBAND_COMM_2026-09-07.*'
      - 'audits/P11_R43_SCHUR_XBAND_ANCHOR_PHASE_2026-09-07.*'
      - 'audits/P11_R43_SCHUR_CORR_STRUCTURED_HUB_PROXY_2026-09-06.py'
      - 'audits/P11_R43_SCHUR_VAR_DELTA_SWEEP_2026-09-06.py'
      - '.github/workflows/r43-schur-xband-comm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-proxy-not-theorem:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.5'
      - name: Verify head and runtime
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD
          python --version
          python -m pip install --disable-pip-version-check 'numpy==2.3.5' 'scipy==1.17.0'
      - name: Parents and complete finite proxy checks
        run: |
          python audits/P11_R43_SCHUR_XBAND_COMM_2026-09-07.py --parents --output /tmp/r43-xband.json
          python audits/P11_R43_SCHUR_XBAND_ANCHOR_PHASE_2026-09-07.py --output /tmp/r43-anchor.json
      - name: Full numerical record; no theorem promotion
        run: |
          cat /tmp/r43-xband.json
          cat /tmp/r43-anchor.json
          echo 'Finite proxy tests only. No independent mathematical certification or theorem-registry promotion.' >> "$GITHUB_STEP_SUMMARY"
