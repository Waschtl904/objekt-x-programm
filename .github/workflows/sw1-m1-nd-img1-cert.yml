name: SW1 M1-ND IMG1 certificate

on:
  push:
    branches:
      - main
      - research/sw1-m1-nd-img1
    paths:
      - 'audits/P11_R32_SW1_M1_ND_IMG1_EFFECTIVE_LEDGER_CANDIDATE.md'
      - 'scripts/certify_sw1_m1_nd_img1_effective_ledger.py'
      - 'scripts/certify_sw1_a10_c2_m1_full_b96.py'
      - 'scripts/certify_sw1_m1_nd_image_space.py'
      - '.github/workflows/sw1-m1-nd-img1-cert.yml'
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record provenance
        run: |
          python --version
          git rev-parse HEAD
          git hash-object audits/P11_R32_SW1_M1_ND_IMG1_EFFECTIVE_LEDGER_CANDIDATE.md
          git hash-object scripts/certify_sw1_m1_nd_img1_effective_ledger.py
          git hash-object scripts/certify_sw1_a10_c2_m1_full_b96.py
          git hash-object scripts/certify_sw1_m1_nd_image_space.py

      - name: Run IMG1 certificate
        run: python scripts/certify_sw1_m1_nd_img1_effective_ledger.py
