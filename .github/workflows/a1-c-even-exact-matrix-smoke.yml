name: A1 C-even exact dyadic matrix smoke
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-matrix-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install exact numerical dependency
        run: python -m pip install python-flint==0.9.0
      - name: Run exact-head signed dyadic matrix smoke
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git hash-object scripts/certify_a1_c_even_exact_dyadic_matrix.py
          python scripts/certify_a1_c_even_exact_dyadic_matrix.py --smoke --smoke-panels 4 | tee a1_c_even_exact_matrix_smoke.log
          grep -q 'CERTIFIED: exact signed weighted-Gram and common integer scaling smoke passed' a1_c_even_exact_matrix_smoke.log
          grep -q 'FIREWALL: smoke mode is not full C-even positivity' a1_c_even_exact_matrix_smoke.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a1-c-even-exact-matrix-smoke
          path: a1_c_even_exact_matrix_smoke.log
