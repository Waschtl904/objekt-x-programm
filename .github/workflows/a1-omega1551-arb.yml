name: A1 Omega1551 reduced-band Arb certificate
on:
  pull_request:
    paths:
      - 'scripts/check_a1_omega1551_arb.py'
      - '.github/workflows/a1-omega1551-arb.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a1-omega1551:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install exact numerical dependency
        run: python -m pip install python-flint==0.9.0
      - name: Run exact-head reduced-band certificate
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git hash-object scripts/check_a1_omega1551_arb.py
          python scripts/check_a1_omega1551_arb.py | tee a1_omega1551_arb.log
          grep -q 'CERTIFIED: m_1(xi) > 0.1 for every |xi| >= 1551' a1_omega1551_arb.log
          grep -q 'CERTIFIED: ||r||_infty < 12 on |xi|<=1551' a1_omega1551_arb.log
          grep -q 'CERTIFIED: PSWF lambda_1210(c=1551) < 1.5e-42' a1_omega1551_arb.log
          grep -q 'CERTIFIED: Schur penalty < 2.2e-39' a1_omega1551_arb.log
          grep -q 'CERTIFIED: resolved lower bound 3e-39 is sufficient for A1 positivity' a1_omega1551_arb.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a1-omega1551-arb
          path: a1_omega1551_arb.log
