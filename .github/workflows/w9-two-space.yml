name: W9 conditional real two-space proof

on:
  pull_request:
    paths:
      - 'research/x-c1/w9-two-space-even-2026-10-24/**'
      - 'research/x-c1/w9-l1-source-chain-even-2026-10-24/**'
      - '.github/workflows/w9-two-space.yml'
  push:
    branches: [main]
    paths:
      - 'research/x-c1/w9-two-space-even-2026-10-24/**'
      - 'research/x-c1/w9-l1-source-chain-even-2026-10-24/**'
      - '.github/workflows/w9-two-space.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-protected-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Check exact revision, L1 dependency and bounded protected replay
        run: >-
          python -B research/x-c1/w9-two-space-even-2026-10-24/verify.py
          --replay --report "$RUNNER_TEMP/two-space-publication.json"
      - name: Check publication binding failures and early optimization guards
        run: python -B research/x-c1/w9-two-space-even-2026-10-24/test_controls.py
