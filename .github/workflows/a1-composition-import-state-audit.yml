name: A1 composition import-state audit (no matrix build)
on:
  push:
    branches: ['audit/a1-composition-2026-09-15']
    paths:
      - '.github/workflows/a1-composition-import-state-audit.yml'
      - 'scripts/check_a1_composition_import_state.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import-state-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install frozen numerical dependency
        run: python -m pip install python-flint==0.9.0
      - name: Reproduce source-bound initialisation states in fresh subprocesses
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python --version
          python -m pip show python-flint
          python scripts/check_a1_composition_import_state.py | tee a1_import_state_diagnostic.log
          grep -q 'KNOWN_IMPORT_STATE_MISMATCH_REPRODUCED' a1_import_state_diagnostic.log
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a1-composition-import-state-diagnostic
          path: |
            a1_import_state_diagnostic.json
            a1_import_state_diagnostic.log
          if-no-files-found: warn
