name: Canonical Schur coupling certificates

on:
  pull_request:
    paths:
      - "research/x-c1/canonical-schur-coupling-2026-09-30/**"
      - ".github/workflows/canonical-schur-coupling.yml"
  push:
    branches: [main]
    paths:
      - "research/x-c1/canonical-schur-coupling-2026-09-30/**"
      - ".github/workflows/canonical-schur-coupling.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    name: canonical-schur-certificate-replay
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned interval arithmetic for edge-case checks
        run: python -m pip install -r research/x-c1/canonical-schur-coupling-2026-09-30/requirements.txt
      - name: Verify preserved sources and replay all four certificates
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: python research/x-c1/canonical-schur-coupling-2026-09-30/replay.py --output "${{ runner.temp }}/canonical-schur-replay"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: canonical-schur-certificate-replay
          path: |
            ${{ runner.temp }}/canonical-schur-replay/*.json
            ${{ runner.temp }}/canonical-schur-replay/*.log
          if-no-files-found: error
