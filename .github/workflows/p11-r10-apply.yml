name: P11 R10 apply repair

on:
  push:
    paths:
      - '.github/workflows/p11-r10-apply.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and apply R10 patch
        run: |
          git apply --check patches/p11-r10-residual-full-rest.patch
          git apply patches/p11-r10-residual-full-rest.patch
          git diff --check
          git diff -- papers/P11_Global_Coupling_and_Object_X_Candidate_Geometry.tex

      - name: Install TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-lang-german

      - name: Compile repaired P11 twice
        working-directory: papers
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error P11_Global_Coupling_and_Object_X_Candidate_Geometry.tex
          pdflatex -interaction=nonstopmode -halt-on-error P11_Global_Coupling_and_Object_X_Candidate_Geometry.tex
          if grep -E "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|multiply defined|Multiply defined" P11_Global_Coupling_and_Object_X_Candidate_Geometry.log; then
            echo 'Unresolved or multiply-defined LaTeX references/citations detected.'
            exit 1
          fi

      - name: Commit repaired paper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/P11_Global_Coupling_and_Object_X_Candidate_Geometry.tex
          git commit -m 'Repair P11 R10 residual cutoff and full-rest derivation'
          git push origin HEAD:main
