name: Canonical adaptive odd angle certificates

on:
  pull_request:
    paths:
      - "research/x-c1/**"
      - ".github/workflows/canonical-adaptive-odd-angle.yml"
  push:
    branches: [main]
    paths:
      - "research/x-c1/**"
      - ".github/workflows/canonical-adaptive-odd-angle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Preserve original source bytes
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r research/x-c1/canonical-adaptive-odd-angle-2026-10-02/requirements.txt
      - name: Replay all 1121 numerical box receipts and controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B research/x-c1/canonical-adaptive-odd-angle-2026-10-02/replay.py --output "${{ runner.temp }}/adaptive-odd-angle"
      - name: Preserve exact receipts and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adaptive-odd-angle-replay-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/adaptive-odd-angle/*.json
            ${{ runner.temp }}/adaptive-odd-angle/*.log
            ${{ runner.temp }}/adaptive-odd-angle/numerical/*.json
            ${{ runner.temp }}/adaptive-odd-angle/numerical/*.log
          if-no-files-found: error
          retention-days: 30
