name: November research integration bindings

on:
  pull_request:
    paths:
      - 'research/x-c1/november-integration-2026-11-11/**'
      - '.github/workflows/november-research-integration.yml'
  push:
    branches: [main]
    paths:
      - 'research/x-c1/november-integration-2026-11-11/**'
      - '.github/workflows/november-research-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-bindings:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Check Git bytes, original members, scope and bounded scalar replay
        run: python -B research/x-c1/november-integration-2026-11-11/verify_integration.py
      - name: Reject damaged originals and false completion claims
        run: python -B research/x-c1/november-integration-2026-11-11/test_controls.py
