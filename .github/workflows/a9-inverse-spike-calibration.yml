name: A9 inverse spike one-direction calibration

on:
  pull_request:
    paths:
      - 'research/x-c1/a9-inverse-spike-calibration-2026-10-15/**'
      - '.github/workflows/a9-inverse-spike-calibration.yml'
  push:
    branches: [main]
    paths:
      - 'research/x-c1/a9-inverse-spike-calibration-2026-10-15/**'
      - '.github/workflows/a9-inverse-spike-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Exact rank-one decomposition and budget-gap witnesses
        run: python -B research/x-c1/a9-inverse-spike-calibration-2026-10-15/verify.py
