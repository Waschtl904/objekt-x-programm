name: A9 inverse spike one-direction calibration

on:
  pull_request:
    paths:
      - 'research/x-c1/a9-inverse-spike-calibration-2026-10-15/**'
      - '.github/workflows/a9-inverse-spike-calibration.yml'
      - 'scripts/replay_spike_budget_nstar.py'
      - 'scripts/replay_a9_sealed.py'
      - 'tests/test_spike_budget_nstar_replay.py'
  push:
    branches: [main]
    paths:
      - 'research/x-c1/a9-inverse-spike-calibration-2026-10-15/**'
      - '.github/workflows/a9-inverse-spike-calibration.yml'
      - 'scripts/replay_spike_budget_nstar.py'
      - 'scripts/replay_a9_sealed.py'
      - 'tests/test_spike_budget_nstar_replay.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Exact rank-one decomposition and budget-gap witnesses
        run: python -B research/x-c1/a9-inverse-spike-calibration-2026-10-15/verify.py
      - name: Addendum guards (budget direction and N*Jp packages)
        run: python -B -m unittest discover -s tests -p test_spike_budget_nstar_replay.py -v
      - name: Replay sealed budget-direction and N*Jp packages
        run: python -u -B scripts/replay_spike_budget_nstar.py --output "${{ runner.temp }}/spike-addendum-check"
