name: Terminal Schur same-engine B calibration

on:
  push:
    paths:
      - "research/x-c1/terminal-191d-same-engine-B-calibration-2026-09-20/**"
      - "research/x-c1/terminal-191d-schur-enclosure-2026-09-20/generate_terminal_matrices.py"
      - ".github/workflows/terminal-schur-b-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned Arb/FLINT binding
        run: python -m pip install "python-flint==0.9.0"
      - name: Run same-engine B calibration
        working-directory: research/x-c1/terminal-191d-same-engine-B-calibration-2026-09-20
        run: python calibrate_B.py --output calibration_results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-schur-B-calibration
          path: research/x-c1/terminal-191d-same-engine-B-calibration-2026-09-20/calibration_results.json
          if-no-files-found: ignore
