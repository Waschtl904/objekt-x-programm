name: A1 composition scalar and provenance audit
on:
  push:
    branches: ['audit/a1-composition-2026-09-15']
    paths:
      - '.github/workflows/a1-composition-scalar-audit.yml'
      - 'scripts/check_a1_composition_rational.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  scalar-and-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Independent exact-rational inequalities
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python --version
          python scripts/check_a1_composition_rational.py | tee a1_composition_rational.log
      - name: Verify frozen source identity and historical run metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee a1_composition_provenance.log
          import hashlib, json, os, sys
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          sys.path.insert(0, 'scripts')
          from check_a1_composition_import_state import source_check
          source_check(Path('scripts'))
          scalar = Path('scripts/check_a1_composition_rational.py').read_bytes()
          scalar_blob = hashlib.sha1(b'blob '+str(len(scalar)).encode()+b'\0'+scalar).hexdigest()
          if scalar_blob != '5c35a78ea28fd5edb79ce2941bd3b24f861bb8a2':
              raise RuntimeError('scalar checker drift')
          repo = 'Waschtl904/objekt-x-programm'
          root = 'https://api.github.com/repos/'+repo+'/'
          def get(path):
              request = Request(root+path, headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'User-Agent': 'a1-composition-audit'})
              with urlopen(request, timeout=45) as response:
                  return json.load(response)
          main_anchor = 'ac164bbbd2c46623aa64e567d21f813f41f164b0'
          exact_head = '4f5bc7b2f5e90092b95c80d90aab9a102853cf73'
          trees = {sha:get('git/commits/'+sha)['tree']['sha'] for sha in (main_anchor, exact_head)}
          if set(trees.values()) != {'0fda00eea117a75c3f059147ca0d563078c1d6c9'}:
              raise RuntimeError('main/import-head tree identity failed')
          imported = {
              34921767085: 'a1-omega1551-arb.yml',
              34921767091: 'a1-legendre-tail-arb.yml',
              34921767108: 'a1-legendre-quadrature-budget-arb.yml',
              34921767233: 'a1-c-even-eval-shards-arb.yml',
              34921767203: 'a1-c-odd-eval-shards-arb.yml',
              34921767182: 'a1-c-even-dyadic-budget-arb.yml',
              34921767282: 'a1-c-odd-dyadic-budget-arb.yml',
              34921767177: 'a1-c-odd-exact-matrix-build.yml',
              34921767230: 'a1-c-even-artifact-spd-ldl.yml',
              34921767303: 'a1-c-odd-artifact-spd-ldl.yml',
          }
          runs = []
          for run_id, filename in imported.items():
              r=get('actions/runs/'+str(run_id))
              if not (r['head_sha']==exact_head and r['status']=='completed' and r['conclusion']=='success'
                      and r['path']=='.github/workflows/'+filename):
                  raise RuntimeError('invalid imported run '+str(run_id))
              runs.append({k:r[k] for k in ('id','head_sha','path','status','conclusion','html_url')})
          bridge=get('actions/runs/35005611795')
          if not (bridge['head_sha']=='9e7b570e755e76adce16596348312d26410403ac'
                  and bridge['conclusion']=='success' and bridge['status']=='completed'
                  and bridge['path']=='.github/workflows/a1-c-odd-proposal-identity-audit.yml'):
              raise RuntimeError('invalid completed proposal bridge')
          # Re-bind the exact numerical builders used by the discovery artifacts.
          comparisons=[]
          for source, names in (
              ('419202e376b75b872a31b77a126ca5e784d9b3ed', (
                  'check_a1_c_even_engine_preflight_arb.py',
                  'certify_a1_c_even_exact_dyadic_matrix.py', 'a1_c_even_matrix_artifact.py')),
              ('b3438c15f506cfd1f0d1cebfd044c0732d1d0b44', (
                  'check_a1_c_even_engine_preflight_arb.py',
                  'certify_a1_c_even_exact_dyadic_matrix.py',
                  'certify_a1_c_odd_exact_dyadic_matrix.py', 'a1_c_odd_matrix_artifact.py')),
          ):
              for name in names:
                  raw=Path('scripts', name).read_bytes()
                  local=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
                  historical=get('contents/scripts/'+quote(name)+'?ref='+source)['sha']
                  if local != historical:
                      raise RuntimeError('discovery source drift: '+name)
                  comparisons.append({'source_head':source,'path':'scripts/'+name,'blob':local})
          report={'model_anchor':main_anchor,'identical_tree':trees[main_anchor],
                  'audit_head':os.environ['GITHUB_SHA'],'audit_run':os.environ['GITHUB_RUN_ID'],
                  'scalar_checker_blob':scalar_blob,'imported_runs':runs,
                  'identity_bridge':{k:bridge[k] for k in ('id','head_sha','status','conclusion','html_url')},
                  'discovery_source_comparisons':comparisons,'status':'PASS',
                  'firewall':'Metadata/source binding is not an independent replay of the imported matrix, LDL, special-function or real-grid computations. The rational checker supplies the new scalar and endpoint/midpoint repairs.'}
          Path('a1_composition_provenance.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Retain scalar and provenance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a1-composition-scalar-provenance
          path: |
            a1_composition_rational.log
            a1_composition_provenance.json
            a1_composition_provenance.log
          if-no-files-found: warn
