name: A1 C-even dyadic budget Arb certificate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dyadic-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install exact numerical dependency
        run: python -m pip install python-flint==0.9.0
      - name: Run exact-head C-even dyadic budget certificate
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git hash-object scripts/check_a1_c_even_dyadic_budget_arb.py
          python scripts/check_a1_c_even_dyadic_budget_arb.py | tee a1_c_even_dyadic_budget.log
          grep -q 'CERTIFIED: 160-bit dyadic Gauss/moment quantization error < 4e-43' a1_c_even_dyadic_budget.log
          grep -q 'CERTIFIED: frozen finite model ledger < 4.5e-38' a1_c_even_dyadic_budget.log
          grep -q 'CERTIFIED: exact dyadic shift 1.005e-35 dominates target 1e-35 plus ledger' a1_c_even_dyadic_budget.log
          grep -q 'CERTIFIED: later dyadic Gauss/moment matrix can be represented by one exact integer symmetric matrix' a1_c_even_dyadic_budget.log
          grep -q 'FIREWALL: this is not the 1075x1075 finite positivity certificate' a1_c_even_dyadic_budget.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a1-c-even-dyadic-budget
          path: a1_c_even_dyadic_budget.log
