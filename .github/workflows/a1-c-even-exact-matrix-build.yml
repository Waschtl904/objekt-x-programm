name: A1 C-even exact dyadic full matrix build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-matrix-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install exact numerical dependency
        run: python -m pip install python-flint==0.9.0
      - name: Build and fingerprint complete exact C-even matrix
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git hash-object scripts/certify_a1_c_even_exact_dyadic_matrix.py
          python scripts/certify_a1_c_even_exact_dyadic_matrix.py --build-only | tee a1_c_even_exact_matrix_build.log
          grep -q '^MATRIX_SHA256=' a1_c_even_exact_matrix_build.log
          grep -q 'CERTIFIED: full exact integer 1075x1075 matrix assembly completed' a1_c_even_exact_matrix_build.log
          grep -q 'CERTIFIED: epsilon_gemm = epsilon_storage = 0 for the exact dyadic matrix' a1_c_even_exact_matrix_build.log
          grep -q 'FIREWALL: exact matrix build is not yet the C-even positivity certificate' a1_c_even_exact_matrix_build.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a1-c-even-exact-matrix-build
          path: a1_c_even_exact_matrix_build.log
