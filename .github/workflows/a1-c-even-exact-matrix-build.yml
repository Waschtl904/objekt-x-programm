name: A1 C-even exact dyadic full matrix build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-matrix-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install exact numerical dependency
        run: python -m pip install python-flint==0.9.0
      - name: Build, serialize and round-trip the frozen exact C-even matrix
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git hash-object scripts/certify_a1_c_even_exact_dyadic_matrix.py
          git hash-object scripts/a1_c_even_matrix_artifact.py
          python scripts/a1_c_even_matrix_artifact.py --build --path a1_c_even_exact_matrix.bin | tee a1_c_even_exact_matrix_build.log
          grep -q '^MATRIX_SHA256=97b761e9f89517303f557d3c18061cc1b232c821e5804fcf9071298e17e60183$' a1_c_even_exact_matrix_build.log
          grep -q 'CERTIFIED: exact C-even integer matrix artifact round-trip matches frozen fingerprint' a1_c_even_exact_matrix_build.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a1-c-even-exact-matrix
          path: |
            a1_c_even_exact_matrix.bin
            a1_c_even_exact_matrix_build.log
          compression-level: 6

  exact-matrix-positivity:
    needs: exact-matrix-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install exact numerical dependency
        run: python -m pip install python-flint==0.9.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: a1-c-even-exact-matrix
          path: .
      - name: Verify artifact fingerprint and certify positivity
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git hash-object scripts/certify_a1_c_even_matrix_artifact_positive.py
          python scripts/certify_a1_c_even_matrix_artifact_positive.py --path a1_c_even_exact_matrix.bin | tee a1_c_even_exact_matrix_positivity.log
          grep -q '^MATRIX_SHA256=97b761e9f89517303f557d3c18061cc1b232c821e5804fcf9071298e17e60183$' a1_c_even_exact_matrix_positivity.log
          grep -q 'CERTIFIED: exact dyadic shifted 1075x1075 C-even matrix is positive definite' a1_c_even_exact_matrix_positivity.log
          grep -q 'CERTIFIED: A_e >= 1e-35 I_1075 after the frozen finite-model ledger' a1_c_even_exact_matrix_positivity.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a1-c-even-exact-matrix-positivity
          path: a1_c_even_exact_matrix_positivity.log
