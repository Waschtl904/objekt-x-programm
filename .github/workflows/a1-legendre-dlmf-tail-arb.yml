name: A1 sharpened DLMF Legendre tail Arb certificate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a1-legendre-dlmf-tail:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install exact numerical dependency
        run: python -m pip install python-flint==0.9.0
      - name: Run exact-head sharpened Legendre-tail certificate
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git hash-object scripts/check_a1_legendre_dlmf_tail_arb.py
          python scripts/check_a1_legendre_dlmf_tail_arb.py | tee a1_legendre_dlmf_tail.log
          grep -q 'CERTIFIED: DLMF Legendre band-tail eta_1730 < 1.2e-46' a1_legendre_dlmf_tail.log
          grep -q 'CERTIFIED: sharpened Legendre Schur penalty < 2e-43' a1_legendre_dlmf_tail.log
          grep -q 'CERTIFIED: final Legendre parity blocks reduce to 865x865 at target 1e-35' a1_legendre_dlmf_tail.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a1-legendre-dlmf-tail
          path: a1_legendre_dlmf_tail.log
