name: NP-GAP short-window Arb certificate
on:
  pull_request:
    paths:
      - 'scripts/check_np_gap_short_window_arb.py'
      - '.github/workflows/np-gap-short-window-arb.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  np-gap-short-window-arb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install exact numerical dependency
        run: python -m pip install python-flint==0.9.0
      - name: Run exact-head short-window certificate
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git hash-object scripts/check_np_gap_short_window_arb.py
          python scripts/check_np_gap_short_window_arb.py | tee np_gap_short_window_arb.log
          grep -q 'CERTIFIED: unique root a_\* lies in the bracket' np_gap_short_window_arb.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: np-gap-short-window-arb
          path: np_gap_short_window_arb.log
