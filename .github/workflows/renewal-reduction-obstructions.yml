name: Renewal reduction and structural obstructions

on:
  pull_request:
    paths:
      - 'research/x-c1/renewal-reduction-and-obstructions-2026-10-15/**'
      - '.github/workflows/renewal-reduction-obstructions.yml'
  push:
    branches: [main]
    paths:
      - 'research/x-c1/renewal-reduction-and-obstructions-2026-10-15/**'
      - '.github/workflows/renewal-reduction-obstructions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Check exact inverse monotonicity, inertia and toy-chain controls
        run: python -B research/x-c1/renewal-reduction-and-obstructions-2026-10-15/verify.py
