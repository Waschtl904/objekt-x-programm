name: A1 C-even engine preflight Arb certificate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a1-c-even-engine-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install exact numerical dependency
        run: python -m pip install python-flint==0.9.0
      - name: Run exact-head C-even special-function preflight
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git hash-object scripts/check_a1_c_even_engine_preflight_arb.py
          python scripts/check_a1_c_even_engine_preflight_arb.py | tee a1_c_even_engine_preflight.log
          grep -q 'CERTIFIED: C-even Bessel recurrence overlaps independent direct Arb values' a1_c_even_engine_preflight.log
          grep -q 'CERTIFIED: C-even moment-series sample coefficients are positive finite enclosures' a1_c_even_engine_preflight.log
          grep -q 'CERTIFIED: C-even special-function engine preflight passed' a1_c_even_engine_preflight.log
          grep -q 'FIREWALL: this is not the 1075x1075 finite positivity certificate' a1_c_even_engine_preflight.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a1-c-even-engine-preflight
          path: a1_c_even_engine_preflight.log
