name: W9 conditional L1 source-chain supplement

on:
  pull_request:
    paths:
      - 'research/x-c1/w9-l1-source-chain-even-2026-10-24/**'
      - '.github/workflows/w9-l1-source-chain.yml'
  push:
    branches: [main]
    paths:
      - 'research/x-c1/w9-l1-source-chain-even-2026-10-24/**'
      - '.github/workflows/w9-l1-source-chain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-l1-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Bind unchanged author archive and replay finite L1 checks
        run: >-
          python -B research/x-c1/w9-l1-source-chain-even-2026-10-24/verify.py
          --replay --report "$RUNNER_TEMP/l1-replay.json"
      - name: Reject missing, changed and unsafe evidence
        run: python -B research/x-c1/w9-l1-source-chain-even-2026-10-24/test_controls.py
