name: NP-PROLATE-1 Arb certificate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  np-prolate-1:
    strategy:
      fail-fast: false
      matrix:
        sector: [even, odd]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install exact numerical dependency
        run: python -m pip install python-flint==0.9.0
      - name: Run NP-PROLATE-1 exact-head certificate
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git hash-object scripts/check_np_prolate_1_arb.py
          python --version
          python scripts/check_np_prolate_1_arb.py "${{ matrix.sector }}" | tee "np_prolate_1_${{ matrix.sector }}.log"
          grep -q "NP-PROLATE-1 ${{ matrix.sector == 'even' && 'EVEN' || 'ODD' }} PASS ZERTIFIZIERT" "np_prolate_1_${{ matrix.sector }}.log"
          grep -q "ALL REQUESTED NP-PROLATE-1 SECTORS PASS ZERTIFIZIERT" "np_prolate_1_${{ matrix.sector }}.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: np-prolate-1-${{ matrix.sector }}
          path: np_prolate_1_${{ matrix.sector }}.log
