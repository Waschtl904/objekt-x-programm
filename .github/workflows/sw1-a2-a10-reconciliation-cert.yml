name: SW1 A2-A10 reconciliation certificate

on:
  push:
    branches:
      - main
      - research/sw1-a2-a10-reconciliation
    paths:
      - 'audits/P11_R32_SW1_A2_A10_RECONCILIATION_AUDIT.md'
      - 'scripts/certify_sw1_a2_a10_kernel_bijections.py'
      - '.github/workflows/sw1-a2-a10-reconciliation-cert.yml'
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned SymPy
        run: python -m pip install --disable-pip-version-check sympy==1.14.0

      - name: Record provenance
        run: |
          python --version
          python - <<'PY'
          import sympy as sp
          print("sympy", sp.__version__)
          PY
          git rev-parse HEAD
          git hash-object audits/P11_R32_SW1_A2_A10_RECONCILIATION_AUDIT.md
          git hash-object scripts/certify_sw1_a2_a10_kernel_bijections.py

      - name: Run reconciliation certificate
        run: python scripts/certify_sw1_a2_a10_kernel_bijections.py
