name: Terminal 191D Schur diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - research/terminal-191d-schur-diagnostic-2026-09-20
    paths:
      - "research/x-c1/terminal-191d-defect-schur-a1-2026-09-20/**"
      - ".github/workflows/terminal-191d-schur-diagnostic.yml"

permissions:
  contents: read
  actions: read

jobs:
  even:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned interval backend
        run: python -m pip install python-flint==0.9.0
      - name: Download frozen even matrix artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: a1-c-even-exact-matrix
          path: artifacts/even
          github-token: ${{ github.token }}
          repository: Waschtl904/objekt-x-programm
          run-id: "34859859764"
      - name: Run even diagnostic
        run: |
          set -euo pipefail
          python research/x-c1/terminal-191d-defect-schur-a1-2026-09-20/check_terminal_schur_diagnostic.py \
            --parity even \
            --artifact artifacts/even/a1_c_even_exact_matrix.bin \
            --precisions 256,384,512 \
            --output-prefix terminal \
            | tee terminal_even.log
      - name: Upload even diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-191d-even-diagnostic
          path: |
            terminal_even.log
            terminal_even_result.json
            terminal_even_*bit_schur.tsv
          if-no-files-found: warn

  odd:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned interval backend
        run: python -m pip install python-flint==0.9.0
      - name: Download frozen odd matrix artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: a1-c-odd-exact-matrix-unfrozen
          path: artifacts/odd
          github-token: ${{ github.token }}
          repository: Waschtl904/objekt-x-programm
          run-id: "34874660758"
      - name: Run odd diagnostic
        run: |
          set -euo pipefail
          python research/x-c1/terminal-191d-defect-schur-a1-2026-09-20/check_terminal_schur_diagnostic.py \
            --parity odd \
            --artifact artifacts/odd/a1_c_odd_exact_matrix.bin \
            --precisions 256,384,512 \
            --output-prefix terminal \
            | tee terminal_odd.log
      - name: Upload odd diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-191d-odd-diagnostic
          path: |
            terminal_odd.log
            terminal_odd_result.json
            terminal_odd_*bit_schur.tsv
          if-no-files-found: warn
