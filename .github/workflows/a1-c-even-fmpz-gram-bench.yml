name: A1 C-even exact dyadic Gram benchmark
on:
  pull_request:
    paths:
      - 'scripts/bench_a1_c_even_fmpz_gram.py'
      - '.github/workflows/a1-c-even-fmpz-gram-bench.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gram-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install exact numerical dependency
        run: python -m pip install python-flint==0.9.0
      - name: Benchmark exact integer Gram products
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git hash-object scripts/bench_a1_c_even_fmpz_gram.py
          python scripts/bench_a1_c_even_fmpz_gram.py | tee a1_c_even_fmpz_gram_bench.log
          grep -q 'DIAGNOSTIC ONLY: timings are not a mathematical certificate' a1_c_even_fmpz_gram_bench.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a1-c-even-fmpz-gram-bench
          path: a1_c_even_fmpz_gram_bench.log
