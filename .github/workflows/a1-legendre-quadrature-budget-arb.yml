name: A1 Legendre quadrature budget Arb certificate
on:
  pull_request:
    paths:
      - 'scripts/check_a1_legendre_quadrature_budget_arb.py'
      - '.github/workflows/a1-legendre-quadrature-budget-arb.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a1-legendre-qbudget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install exact numerical dependency
        run: python -m pip install python-flint==0.9.0
      - name: Run exact-head Legendre quadrature-budget certificate
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git hash-object scripts/check_a1_legendre_quadrature_budget_arb.py
          python scripts/check_a1_legendre_quadrature_budget_arb.py | tee a1_legendre_qbudget.log
          grep -q 'CERTIFIED: |r(z)| < 42 on the A1 Legendre quadrature strip' a1_legendre_qbudget.log
          grep -q 'CERTIFIED: Gauss-40 panel width 0.4 gives parity operator quadrature error < 4e-38' a1_legendre_qbudget.log
          grep -q 'CERTIFIED: analytic quadrature error is >100 times below the 1e-35 head target' a1_legendre_qbudget.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a1-legendre-qbudget
          path: a1_legendre_qbudget.log
