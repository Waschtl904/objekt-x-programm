name: P12 LaTeX check

on:
  push:
    branches:
      - main
    paths:
      - 'papers/P12_Adelic_Hub_Injectivity_Program.tex'
      - 'papers/P12_sections/**'
      - '.github/workflows/p12-latex-check.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-lang-german

      - name: Compile P12 twice
        working-directory: papers
        run: |
          pdflatex -interaction=nonstopmode -file-line-error -halt-on-error P12_Adelic_Hub_Injectivity_Program.tex
          pdflatex -interaction=nonstopmode -file-line-error -halt-on-error P12_Adelic_Hub_Injectivity_Program.tex

      - name: Reject unresolved or multiply-defined references
        working-directory: papers
        run: |
          if grep -E "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|multiply defined|Multiply defined" P12_Adelic_Hub_Injectivity_Program.log; then
            echo 'Unresolved or multiply-defined LaTeX references/citations detected.'
            exit 1
          fi

      - name: Upload P12 LaTeX log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p12-latex-log
          path: papers/P12_Adelic_Hub_Injectivity_Program.log
          if-no-files-found: warn
