name: Q11 wall through A13 preparation

on:
  pull_request:
    paths:
      - "research/x-c1/fourth-chamber-a13-2026-09-28/q11/**"
      - ".github/workflows/q11-wall-a13-prep.yml"
  push:
    branches: [main]
    paths:
      - "research/x-c1/fourth-chamber-a13-2026-09-28/q11/**"
      - ".github/workflows/q11-wall-a13-prep.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-scalar-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Reproduce q11 wall scalar certificate
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: python research/x-c1/fourth-chamber-a13-2026-09-28/q11/verify_q11.py --output "${{ runner.temp }}/q11-check-results.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q11-wall-a13-prep
          path: ${{ runner.temp }}/q11-check-results.json
          if-no-files-found: error
