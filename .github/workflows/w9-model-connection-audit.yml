name: W9 fixed-model connection supplement

on:
  pull_request:
    paths:
      - 'research/x-c1/w9-model-connection-audit-even-2026-10-23/**'
      - '.github/workflows/w9-model-connection-audit.yml'
  push:
    branches: [main]
    paths:
      - 'research/x-c1/w9-model-connection-audit-even-2026-10-23/**'
      - '.github/workflows/w9-model-connection-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-model-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install directed arithmetic
        run: python -m pip install python-flint==0.9.0
      - name: Bind supplement and reject negative controls
        run: |
          python -B research/x-c1/w9-model-connection-audit-even-2026-10-23/verify.py
          python -B research/x-c1/w9-model-connection-audit-even-2026-10-23/test_controls.py
      - name: Replay fixed model and source caps with L1 open
        run: >-
          python -u -B research/x-c1/w9-model-connection-audit-even-2026-10-23/verify.py
          --replay --report "$RUNNER_TEMP/model-publication.json"
