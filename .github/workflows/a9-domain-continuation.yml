name: A9 domains floor and local continuation replay

on:
  pull_request:
    paths:
      - "research/x-c1/a9-domain-continuation-2026-10-13/**"
      - "scripts/replay_a9_sealed.py"
      - "tests/test_a9_sealed_replay.py"
      - ".github/workflows/a9-domain-continuation.yml"
  push:
    branches: [main]
    paths:
      - "research/x-c1/a9-domain-continuation-2026-10-13/**"
      - "scripts/replay_a9_sealed.py"
      - "tests/test_a9_sealed_replay.py"
      - ".github/workflows/a9-domain-continuation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sealed-rational-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Check preservation, failures and CI routing
        run: python -B -m unittest discover -s tests -p test_a9_sealed_replay.py -v
      - name: Replay the sealed certificate with full predecessor field binding
        run: python -u -B scripts/replay_a9_sealed.py --package research/x-c1/a9-domain-continuation-2026-10-13 --output "${{ runner.temp }}/a9-followup-check"
      - name: Preserve commit-bound evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a9-domain-continuation-2026-10-13-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/a9-followup-check/*.json
            ${{ runner.temp }}/a9-followup-check/*.log
          if-no-files-found: error
          retention-days: 90
