name: A1 bounded-band Schur cross Arb certificate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a1-schur-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install exact numerical dependency
        run: python -m pip install python-flint==0.9.0
      - name: Run exact-head A1 Schur-cross certificate
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git hash-object scripts/check_a1_schur_cross_arb.py
          python scripts/check_a1_schur_cross_arb.py | tee a1_schur_cross_arb.log
          grep -q 'CERTIFIED: ||r||_infty < 12 on |xi|<=2300' a1_schur_cross_arb.log
          grep -q 'CERTIFIED: PSWF lambda_1680(c=2300) < 1.1e-39' a1_schur_cross_arb.log
          grep -q 'CERTIFIED: augmented tail lower bound tau > 0.039' a1_schur_cross_arb.log
          grep -q 'CERTIFIED: Schur cross penalty < 4.1e-36' a1_schur_cross_arb.log
          grep -q 'CERTIFIED: resolved lower bound 5e-36 is sufficient for A1 positivity' a1_schur_cross_arb.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a1-schur-cross-arb
          path: a1_schur_cross_arb.log
