name: integrity

on:
  push:
    branches: [main]
    paths:
      - "papers/P11_Global_Coupling_and_Object_X_Candidate_Geometry.tex"
      - "papers/P11_sections/P11_O3af_Gamma_Symbol_Bridge.tex"
      - "00-uebersicht/OBJEKT_X_AKTUELLE_ARBEITSDEFINITION.md"
      - "00-grundlegung/ebene-XVI-objekt-x.md"
      - "00-uebersicht/ACTIVE_THEOREM_REGISTRY.md"
      - ".canary"
      - "ATTRIBUTION.md"
      - "SECURITY.md"
      - "CITATION.cff"
      - "LICENSE"
      - "tests/fixtures/dummy_credentials.json"
      # Workflow-Datei selbst mit aufnehmen, damit Änderungen am
      # Publikationspfad garantiert einen Lauf auslösen.
      - ".github/workflows/integrity.yml"
      - "scripts/build_integrity.sh"
      - "scripts/verify_integrity.sh"
      # INTEGRITY.md selbst, damit auch reine Manifest-Aenderungen
      # (z. B. Nachpflegen von Hashwerten) einen Lauf ausloesen.
      - "INTEGRITY.md"
  workflow_dispatch: {}

# Koordiniert teilnehmende Workflow-Laeufe untereinander; ersetzt keine
# korrekte Veroeffentlichung. cancel-in-progress: false schuetzt den
# gerade laufenden Job; in der Standard-Warteschlange kann jedoch ein
# neuer wartender Lauf einen bereits wartenden ersetzen.
concurrency:
  group: integrity-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main tip explicitly
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Recompute-and-publish loop
        shell: bash
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail
          git config user.name  "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          for attempt in 1 2 3; do
            echo "== attempt $attempt =="
            # Immer frischen main-Stand holen und darauf zuruecksetzen.
            git fetch --quiet origin main
            git checkout --quiet -B main origin/main

            # Manifest AUS DIESEM Snapshot neu berechnen.
            bash scripts/build_integrity.sh > INTEGRITY.md

            # Sofortige Selbstpruefung: Manifest muss zu Quellen passen.
            bash scripts/verify_integrity.sh INTEGRITY.md

            # Erst aufnehmen, dann vorgemerkte Aenderungen pruefen.
            # git diff -- <path> erkennt untracked new files nicht;
            # ein fehlendes Remote-INTEGRITY.md wuerde sonst faelschlich
            # als "nichts zu tun" gemeldet.
            git add -- INTEGRITY.md
            if git diff --cached --quiet -- INTEGRITY.md; then
              echo "INTEGRITY.md already matches source snapshot; nothing to publish."
              exit 0
            fi

            git commit -m "chore(integrity): refresh INTEGRITY.md hash tree"

            if git push origin HEAD:main; then
              echo "published on attempt $attempt"
              exit 0
            fi
            echo "fast-forward push rejected on attempt $attempt; restart from fresh snapshot"
            # Lokalen Commit verwerfen; naechste Runde beginnt neu.
            git reset --hard HEAD~1
          done

          echo "== gave up after 3 attempts; verify remote independently =="
          # Frischen Snapshot ziehen und Remote-Manifest gegen Remote-Quellen pruefen.
          git fetch --quiet origin main
          git checkout --quiet -B main origin/main
          if bash scripts/verify_integrity.sh INTEGRITY.md; then
            echo "remote INTEGRITY.md matches remote sources; accepting sibling publication"
            exit 0
          fi
          echo "remote INTEGRITY.md does NOT match remote sources"
          exit 1
