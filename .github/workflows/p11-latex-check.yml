name: P11 LaTeX check

on:
  push:
    paths:
      - 'papers/P11_Global_Coupling_and_Object_X_Candidate_Geometry.tex'
      - 'papers/P11_sections/**'
      - '.github/workflows/p11-latex-check.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-lang-german

      - name: Compile P11 twice
        working-directory: papers
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error P11_Global_Coupling_and_Object_X_Candidate_Geometry.tex
          pdflatex -interaction=nonstopmode -halt-on-error P11_Global_Coupling_and_Object_X_Candidate_Geometry.tex

      - name: Reject unresolved references
        working-directory: papers
        run: |
          if grep -E "LaTeX Warning: (Reference|Citation).*undefined|There were undefined references" P11_Global_Coupling_and_Object_X_Candidate_Geometry.log; then
            echo 'Unresolved LaTeX references/citations detected.'
            exit 1
          fi
