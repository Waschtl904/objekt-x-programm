name: SW1 M1-ND IMG3 local eliminator

on:
  push:
    branches:
      - research/sw1-m1-nd-img3-eliminator
    paths:
      - 'audits/P11_R32_SW1_M1_ND_IMG3_LOCAL_ELIMINATOR_CANDIDATE.md'
      - 'scripts/certify_sw1_m1_nd_img3_local_eliminator.py'
      - 'scripts/certify_sw1_m1_nd_img3_horizon_contraction_coeffs.py'
      - 'scripts/certify_sw1_m1_nd_img3_b96_mapstability_nogo.py'
      - 'scripts/certify_sw1_m1_nd_img3_n0_annulus_blindset.py'
      - 'scripts/certify_sw1_m1_nd_img3_fixedN_uniform_nogo.py'
      - 'scripts/certify_sw1_m1_nd_img3_linear_visibility_bound.py'
      - 'scripts/certify_sw1_a1_raw_archetypes.py'
      - 'scripts/certify_sw1_a7_finite_state_cocycle.py'
      - 'scripts/certify_sw1_a8_lower_finite_components.py'
      - 'scripts/certify_sw1_sheet_collision_quotient.py'
      - 'scripts/certify_sw1_m1_nd_img4_smallR_separator_visibility.py'
      - 'scripts/certify_sw1_m1_nd_img4_gate1_gate9_graph_p12.py'
      - 'scripts/certify_sw1_m1_nd_img4_gateA_direct_words.py'
      - 'scripts/certify_sw1_m1_nd_img4_gateB_pmp_graphing.py'
      - 'audits/P11_R32_SW1_M1_ND_IMG4_ANALYTIC_GATES_CANDIDATE.md'
      - 'audits/P11_R32_SW1_M1_ND_IMG4_EXTERNAL_REVIEW_PACKET.md'
      - 'audits/P11_R32_SW1_M1_ND_IMG4_GENERAL_SMALLR_NOGO_CANDIDATE.md'
      - 'audits/P11_R32_SW1_M1_ND_IMG4_SMALLR_KERNEL_NOGO_CANDIDATE.md'
      - 'audits/P11_R32_SW1_M1_ND_IMG3_ANALYTIC_HARDENING_CANDIDATE.md'
      - '.github/workflows/sw1-m1-nd-img3-eliminator-cert.yml'
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SymPy
        run: python -m pip install sympy==1.14.0

      - name: Record provenance
        run: |
          python --version
          python -c "import sympy; print('sympy='+sympy.__version__)"
          git rev-parse HEAD
          git hash-object scripts/certify_sw1_m1_nd_img3_local_eliminator.py
          git hash-object scripts/certify_sw1_m1_nd_img3_horizon_contraction_coeffs.py
          git hash-object scripts/certify_sw1_m1_nd_img3_b96_mapstability_nogo.py
          git hash-object scripts/certify_sw1_m1_nd_img3_n0_annulus_blindset.py
          git hash-object scripts/certify_sw1_m1_nd_img3_fixedN_uniform_nogo.py
          git hash-object scripts/certify_sw1_m1_nd_img3_linear_visibility_bound.py
          git hash-object scripts/certify_sw1_a1_raw_archetypes.py
          git hash-object scripts/certify_sw1_a7_finite_state_cocycle.py
          git hash-object scripts/certify_sw1_a8_lower_finite_components.py
          git hash-object scripts/certify_sw1_sheet_collision_quotient.py
          git hash-object scripts/certify_sw1_m1_nd_img4_smallR_separator_visibility.py
          git hash-object scripts/certify_sw1_m1_nd_img4_gate1_gate9_graph_p12.py
          git hash-object scripts/certify_sw1_m1_nd_img4_gateA_direct_words.py
          git hash-object scripts/certify_sw1_m1_nd_img4_gateB_pmp_graphing.py
          git hash-object audits/P11_R32_SW1_M1_ND_IMG4_EXTERNAL_REVIEW_PACKET.md
          git hash-object audits/P11_R32_SW1_M1_ND_IMG4_GENERAL_SMALLR_NOGO_CANDIDATE.md
          if [ -f audits/P11_R32_SW1_M1_ND_IMG4_ANALYTIC_GATES_CANDIDATE.md ]; then
            git hash-object audits/P11_R32_SW1_M1_ND_IMG4_ANALYTIC_GATES_CANDIDATE.md
          fi
          if [ -f audits/P11_R32_SW1_M1_ND_IMG4_SMALLR_KERNEL_NOGO_CANDIDATE.md ]; then
            git hash-object audits/P11_R32_SW1_M1_ND_IMG4_SMALLR_KERNEL_NOGO_CANDIDATE.md
          fi
          if [ -f audits/P11_R32_SW1_M1_ND_IMG3_ANALYTIC_HARDENING_CANDIDATE.md ]; then
            git hash-object audits/P11_R32_SW1_M1_ND_IMG3_ANALYTIC_HARDENING_CANDIDATE.md
          fi
          if [ -f audits/P11_R32_SW1_M1_ND_IMG3_LOCAL_ELIMINATOR_CANDIDATE.md ]; then
            git hash-object audits/P11_R32_SW1_M1_ND_IMG3_LOCAL_ELIMINATOR_CANDIDATE.md
          fi

      - name: Run IMG3 local eliminator certificate
        run: python scripts/certify_sw1_m1_nd_img3_local_eliminator.py

      - name: Run IMG3 horizon contraction coefficient certificate
        run: python scripts/certify_sw1_m1_nd_img3_horizon_contraction_coeffs.py

      - name: Run IMG3 B96 map-stability no-go certificate
        run: python scripts/certify_sw1_m1_nd_img3_b96_mapstability_nogo.py

      - name: Run IMG3 N0 annulus blind-set certificate
        run: python scripts/certify_sw1_m1_nd_img3_n0_annulus_blindset.py

      - name: Run IMG3 fixed-N uniform no-go certificate
        run: python scripts/certify_sw1_m1_nd_img3_fixedN_uniform_nogo.py

      - name: Run IMG3 linear visibility certificate
        run: python scripts/certify_sw1_m1_nd_img3_linear_visibility_bound.py

      - name: Run upstream A1/A7/A8 dependency stack
        run: |
          python scripts/certify_sw1_a1_raw_archetypes.py
          python scripts/certify_sw1_a7_finite_state_cocycle.py
          python scripts/certify_sw1_a8_lower_finite_components.py
          python scripts/certify_sw1_sheet_collision_quotient.py

      - name: Run IMG4 small-R separator visibility certificate
        run: python scripts/certify_sw1_m1_nd_img4_smallR_separator_visibility.py

      - name: Run IMG4 Gate1/Gate9 graph/P12 cross-check
        run: python scripts/certify_sw1_m1_nd_img4_gate1_gate9_graph_p12.py

      - name: Run IMG4 Gate A direct-word cross-check
        run: python scripts/certify_sw1_m1_nd_img4_gateA_direct_words.py

      - name: Run IMG4 Gate B pmp graphing certificate
        run: python scripts/certify_sw1_m1_nd_img4_gateB_pmp_graphing.py
