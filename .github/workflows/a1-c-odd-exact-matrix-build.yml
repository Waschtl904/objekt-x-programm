name: A1 C-odd exact dyadic matrix build
on:
  pull_request:
    paths:
      - 'scripts/check_a1_c_even_engine_preflight_arb.py'
      - 'scripts/certify_a1_c_even_exact_dyadic_matrix.py'
      - 'scripts/certify_a1_c_odd_exact_dyadic_matrix.py'
      - 'scripts/a1_c_odd_matrix_artifact.py'
      - '.github/workflows/a1-c-odd-exact-matrix-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  odd-matrix-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install exact numerical dependency
        run: python -m pip install python-flint==0.9.0
      - name: Smoke exact C-odd backend
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git hash-object scripts/certify_a1_c_odd_exact_dyadic_matrix.py
          python scripts/certify_a1_c_odd_exact_dyadic_matrix.py --smoke --smoke-panels 4 | tee a1_c_odd_matrix_smoke.log
          grep -q 'CERTIFIED: C-odd exact signed weighted-Gram/common-scaling smoke passed' a1_c_odd_matrix_smoke.log
          grep -q 'FIREWALL: smoke mode is not full C-odd positivity' a1_c_odd_matrix_smoke.log

  odd-exact-matrix-build:
    needs: odd-matrix-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install exact numerical dependency
        run: python -m pip install python-flint==0.9.0
      - name: Build, serialize and round-trip the full exact C-odd matrix
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git hash-object scripts/check_a1_c_even_engine_preflight_arb.py
          git hash-object scripts/certify_a1_c_even_exact_dyadic_matrix.py
          git hash-object scripts/certify_a1_c_odd_exact_dyadic_matrix.py
          git hash-object scripts/a1_c_odd_matrix_artifact.py
          python scripts/a1_c_odd_matrix_artifact.py --build --path a1_c_odd_exact_matrix.bin | tee a1_c_odd_exact_matrix_build.log
          grep -Eq '^MATRIX_SHA256=[0-9a-f]{64}$' a1_c_odd_exact_matrix_build.log
          grep -q 'CERTIFIED: exact C-odd integer matrix artifact round-trip matches fresh fingerprint' a1_c_odd_exact_matrix_build.log
          grep -q 'FIREWALL: fingerprint must be frozen in a follow-up commit before positivity promotion' a1_c_odd_exact_matrix_build.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a1-c-odd-exact-matrix-unfrozen
          path: |
            a1_c_odd_exact_matrix.bin
            a1_c_odd_exact_matrix_build.log
          compression-level: 6
