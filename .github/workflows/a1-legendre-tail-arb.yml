name: A1 Legendre tail Arb certificate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a1-legendre-tail:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install exact numerical dependency
        run: python -m pip install python-flint==0.9.0
      - name: Run exact-head orthonormal-Legendre tail certificate
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git hash-object scripts/check_a1_legendre_tail_arb.py
          python scripts/check_a1_legendre_tail_arb.py | tee a1_legendre_tail_arb.log
          grep -q 'CERTIFIED: Legendre band-tail eta_2150 < 4.8e-42' a1_legendre_tail_arb.log
          grep -q 'CERTIFIED: Legendre Schur penalty < 7e-39' a1_legendre_tail_arb.log
          grep -q 'CERTIFIED: finite parity-block lower bound 1e-35 is sufficient for A1 positivity' a1_legendre_tail_arb.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a1-legendre-tail-arb
          path: a1_legendre_tail_arb.log
