name: P11 R37 two-shift Gamma mismatch

on:
  push:
    branches:
      - research/strong-terminal-r37-two-shift-mismatch
    paths:
      - 'audits/P11_REFEREE_E2E_R37_TWO_SHIFT_GAMMA_PAIRING_MISMATCH_2026-09-01.md'
      - 'scripts/certify_p11_r37_two_shift_gamma_algebra.py'
      - '.github/workflows/p11-r37-two-shift-gamma-mismatch.yml'
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SymPy
        run: python -m pip install sympy==1.14.0

      - name: Record provenance
        run: |
          python --version
          python -c "import sympy; print('sympy='+sympy.__version__)"
          git rev-parse HEAD
          git hash-object audits/P11_REFEREE_E2E_R37_TWO_SHIFT_GAMMA_PAIRING_MISMATCH_2026-09-01.md
          git hash-object scripts/certify_p11_r37_two_shift_gamma_algebra.py
          git hash-object audits/P11_REFEREE_E2E_R36A14_2I_COMPLETE_FIRST_TWO_SHIFT_CLASSIFICATION_2026-08-20.md
          git hash-object audits/P11_REFEREE_E2E_R36A13C_GAMMA_PAIRING_MISMATCH_2026-08-20.md
          git hash-object audits/P11_REFEREE_E2E_R31_GAMMA_ANTILOCALITY_CANCELLATION_GATE_2026-08-19.md
          git hash-object audits/P11_REFEREE_E2E_R33_GAMMA_SYMBOL_BRIDGE_2026-08-19.md
          git hash-object audits/P11_REFEREE_E2E_R28_FIXED_GAMMA_CROSSBLOCK_NORMAL_MISMATCH_2026-08-15.md
          git hash-object audits/P11_REFEREE_E2E_R30_RIESZ_SUPPORT_RADIUS_2026-08-15.md

      - name: Run exact R37 algebra certificate
        run: python scripts/certify_p11_r37_two_shift_gamma_algebra.py
