name: Canonical full shift and primal dual certificates

on:
  pull_request:
    paths:
      - "research/x-c1/**"
      - ".github/workflows/canonical-full-shift-primal-dual.yml"
  push:
    branches: [main]
    paths:
      - "research/x-c1/**"
      - ".github/workflows/canonical-full-shift-primal-dual.yml"
  workflow_dispatch:
    inputs:
      full:
        description: Repeat the large operator integrals as well
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  replay:
    # The sealed receipts preserve the original Windows newline bytes.
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned Arb bindings
        run: python -m pip install -r research/x-c1/canonical-full-shift-primal-dual-2026-10-02/requirements.txt
      - name: Replay immutable packages and audit shared inputs
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          FULL_REPLAY: ${{ inputs.full || false }}
        shell: bash
        run: |
          args=()
          if [[ "$FULL_REPLAY" == "true" ]]; then args+=(--full); fi
          python -B research/x-c1/canonical-full-shift-primal-dual-2026-10-02/replay.py --output "${{ runner.temp }}/full-shift-primal-dual-replay" "${args[@]}"
      - name: Preserve exact replay receipts and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-shift-primal-dual-replay-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/full-shift-primal-dual-replay/*.json
            ${{ runner.temp }}/full-shift-primal-dual-replay/*.log
            ${{ runner.temp }}/full-shift-primal-dual-replay/primal-dual/*.json
            ${{ runner.temp }}/full-shift-primal-dual-replay/primal-dual/*.log
            ${{ runner.temp }}/full-shift-primal-dual-replay/full-shift/*.json
            ${{ runner.temp }}/full-shift-primal-dual-replay/full-shift/*.log
          if-no-files-found: error
          retention-days: 30
