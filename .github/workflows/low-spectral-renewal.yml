name: Low spectral spaces and canonical extensions

on:
  pull_request:
    paths:
      - "research/x-c1/renewable-low-schur-spectral-2026-09-29/**"
      - ".github/workflows/low-spectral-renewal.yml"
  push:
    branches: [main]
    paths:
      - "research/x-c1/renewable-low-schur-spectral-2026-09-29/**"
      - ".github/workflows/low-spectral-renewal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    name: spectral-replay-${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        case: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned arithmetic
        run: python -m pip install -r research/x-c1/renewable-low-schur-spectral-2026-09-29/requirements.txt
      - name: Verify preserved inputs and reproduce this block
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: python research/x-c1/renewable-low-schur-spectral-2026-09-29/replay.py --case ${{ matrix.case }} --output "${{ runner.temp }}/spectral-replay"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: spectral-replay-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/spectral-replay/*.json
            ${{ runner.temp }}/spectral-replay/*.log
            ${{ runner.temp }}/spectral-replay/case*/**/*.json
          if-no-files-found: warn
