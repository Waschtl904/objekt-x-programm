name: A1 C-odd hash-fixed artifact SPD LDL certificate

on:
  pull_request:
    paths:
      - 'scripts/check_a1_c_even_engine_preflight_arb.py'
      - 'scripts/certify_a1_c_even_exact_dyadic_matrix.py'
      - 'scripts/certify_a1_c_odd_exact_dyadic_matrix.py'
      - 'scripts/a1_c_odd_matrix_artifact.py'
      - 'scripts/check_a1_c_odd_artifact_spd_ldl.c'
      - '.github/workflows/a1-c-odd-artifact-spd-ldl.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-artifact-spd-ldl:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SOURCE_RUN_ID: '34874660758'
      SOURCE_HEAD: 'b3438c15f506cfd1f0d1cebfd044c0732d1d0b44'
      EXPECTED_MATRIX_SHA256: '6cff5e4710f0f23c4b43503e5b398525898e0a034e61c25791526ad94f17e295'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install pinned Python checker and system FLINT C headers
        run: |
          set -euo pipefail
          python -m pip install python-flint==0.9.0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libflint-dev libssl-dev
          dpkg-query -W -f='libflint-dev=${Version}\n' libflint-dev

      - name: Download exact C-odd matrix artifact from frozen discovery run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: a1-c-odd-exact-matrix-unfrozen
          path: .
          github-token: ${{ github.token }}
          repository: Waschtl904/objekt-x-programm
          run-id: 34874660758

      - name: Reverify frozen artifact with the original Python codec
        run: |
          set -euo pipefail
          echo "SOURCE_RUN_ID=${SOURCE_RUN_ID}"
          echo "SOURCE_HEAD=${SOURCE_HEAD}"
          python scripts/a1_c_odd_matrix_artifact.py \
            --verify \
            --path a1_c_odd_exact_matrix.bin \
            --expect-sha "${EXPECTED_MATRIX_SHA256}" \
            | tee a1_c_odd_artifact_reverify.log
          grep -q "^MATRIX_SHA256=${EXPECTED_MATRIX_SHA256}$" a1_c_odd_artifact_reverify.log
          grep -q 'CERTIFIED: loaded C-odd integer matrix matches frozen fingerprint' a1_c_odd_artifact_reverify.log

      - name: Compile direct rigorous Arb LDL SPD checker
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git hash-object scripts/check_a1_c_odd_artifact_spd_ldl.c
          cc -O3 -std=c11 -Wall -Wextra \
            scripts/check_a1_c_odd_artifact_spd_ldl.c \
            -o check_a1_c_odd_artifact_spd_ldl \
            -lflint -lmpfr -lgmp -lcrypto -lm -lpthread

      - name: Certify positivity of the hash-fixed exact C-odd matrix by Arb LDL
        run: |
          set -euo pipefail
          ./check_a1_c_odd_artifact_spd_ldl a1_c_odd_exact_matrix.bin | tee a1_c_odd_artifact_spd_ldl.log
          grep -q "^MATRIX_SHA256=${EXPECTED_MATRIX_SHA256}$" a1_c_odd_artifact_spd_ldl.log
          grep -q 'CERTIFIED: exact hash-fixed 1075x1075 C-odd integer matrix is positive definite by Arb LDL' a1_c_odd_artifact_spd_ldl.log
          grep -q 'CERTIFIED: A_o >= 1e-35 I_1075 after the frozen finite-model ledger' a1_c_odd_artifact_spd_ldl.log

      - name: Upload LDL audit logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a1-c-odd-hash-fixed-spd-ldl
          path: |
            a1_c_odd_artifact_reverify.log
            a1_c_odd_artifact_spd_ldl.log
          if-no-files-found: warn
